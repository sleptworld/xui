[package]
name = "xui"
version = "0.1.0"
edition = "2024"

[dependencies]
xui-animation = {path="../crates/xui-animation"}
xui-core = {path="../crates/xui-core"}
xui-interface = {path="../crates/xui-interface"}
xui-macros = {path="../crates/xui-macros"}

[target.'cfg(target_os = "macos")'.dependencies]
xui-macos = { path = "../crates/xui-macos", default-features = false }

[features]
default = ["vello"]
# `runner` on the Vello backend.
vello = ["xui-macos/vello"]
# `skia_runner` on the Skia backend. Independent of `vello`.
skia = ["xui-macos/skia"]
# Skia on a wgpu-owned device, so a canvas GPU painter can composite.
skia-wgpu = ["xui-macos/skia-wgpu"]
