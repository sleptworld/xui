[workspace]
resolver = "3"
members = [
    "lucide-rs",
    "xui-assets",
    "xui-interface",
    "xui-pak",
    "xui-pak-build",
    "xui-pak-cli",
    "xui-build",
    "xui",
    "xui-macros",
    "xui-winit",
    "xui-example-app",
    # "xui-text",
    "xui-components",
    "xui-cli",
    "xui-animation",
    "slot", "xui-cosmic",
    "xui-render-graph",
    "xui-skia",
    "xui-f",
]
# Crates built by default by plain `cargo` (build/check/test/doc).
# `xui-example-app` packs its assets from its own build script (`xui-build`),
# so plain `cargo` builds it like any other member.
default-members = [
    "lucide-rs",
    "xui-assets",
    "xui-interface",
    "xui-pak",
    "xui-pak-build",
    "xui-pak-cli",
    "xui-build",
    "xui",
    "xui-macros",
    "xui-winit",
    "xui-components",
    "xui-cli",
    "xui-animation",
    "slot",
    "xui-cosmic",
    "xui-render-graph",
    "xui-skia",
    "xui-f",
    "xui-example-app",
]


[workspace.dependencies]
blake3 = "1"
camino = { version = "1", features = ["serde1"] }
glam = "0.32.1"
memmap2 = "0.9"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zune-core = "0.5.1"
zune-image = { version = "0.5.0", default-features = false, features = ["jpeg", "png"] }
zstd = "0.13"
tokio = { version = "1.52.3", features = ["full"] }
