[package]
name = "xui-winit"
version = "0.1.0"
edition = "2024"

[features]
default = ["skia"]
skia = ["dep:xui-skia"]
wgpu = ["dep:wgpu"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
etagere = {version="0.3.0", optional=true}
pollster = {version="0.4.0",optional=true}
wgpu = { version="29.0.3", optional=true}
winit = "0.30.12"
xui = { path = "../xui" }
xui-render-graph = { path = "../xui-render-graph" }
xui-interface = { path = "../xui-interface" }
# xui-text-engine = { path = "../xui-text-engine" }
xui-f = {path="../xui-f"}

glam = { workspace = true }
thiserror = "2.0.18"
log = "0.4.29"
moka = { version = "0.12.15", features = ["sync"] }
rustc-hash = "2.1.3"
vello = { version = "0.9.0", default-features = false, features = ["wgpu"], optional=true }
xui-skia = { path = "../xui-skia", optional = true }

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
