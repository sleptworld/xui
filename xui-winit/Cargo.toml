[package]
name = "xui-winit"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
etagere = "0.3.0"
pollster = "0.4.0"
wgpu = "29.0.3"
winit = "0.30.12"
xui = { path = "../xui" }
xui-interface = { path = "../xui-interface" }
xui-text-engine = { path = "../xui-text-engine" }

glam = { workspace = true }
thiserror = "2.0.18"
log = "0.4.29"
moka = { version = "0.12.15", features = ["sync"] }
lyon_path = "1.0.16"
lyon_tessellation = "1.0.20"
rustc-hash = "2.1.3"

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
