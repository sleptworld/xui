[package]
name = "xui-example-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xui-example-app"
path = "src/main.rs"

[[bin]]
name = "flight-icing"
path = "src/bin/flight_icing/main.rs"

[dependencies]
xui-core = { path = "../crates/xui-core" }
xui-macros = { path = "../crates/xui-macros" }
xui-macos = { path = "../crates/xui-macos", features=["skia"] }
xui-components = { path = "../xui-components" }
xui-skia = { path = "../crates/xui-skia" }
xui-f = { path = "../crates/xui-f" }
lucide-rs = { path = "../lucide-rs" }
leanplot = { git = "https://github.com/sleptworld/LeanPlot.git" }


[dev-dependencies]
png = "0.18.1"
xui-cosmic = { path = "../crates/xui-cosmic" }

[build-dependencies]
xui-build = { version = "0.1.0", path = "../crates/xui-build" }
