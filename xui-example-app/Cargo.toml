[package]
name = "xui-example-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xui-example-app"
path = "src/main.rs"

[[bin]]
name = "flight-icing"
path = "src/bin/flight_icing/main.rs"

[features]
# Run the gallery and the dashboard on the Skia backend instead of Vello.
skia = ["dep:xui-skia", "xui-macos/skia"]

[dependencies]
xui-vello = { path = "../crates/xui-vello" }
xui-core = { path = "../crates/xui-core" }
xui-macros = { path = "../crates/xui-macros" }
xui-macos = { path = "../crates/xui-macos" }
xui-components = { path = "../xui-components" }
xui-editor = { path = "../crates/xui-editor" }
xui-skia = { path = "../crates/xui-skia", optional = true }
xui-f = { path = "../crates/xui-f" }
lucide-rs = { path = "../lucide-rs" }
leanplot = { git = "https://github.com/sleptworld/LeanPlot.git" }


[dev-dependencies]
png = "0.18.1"
# Pixel snapshots use the optional `skia` feature; default smoke tests use
# the backend-independent scene with a real text engine.
xui-cosmic = { path = "../crates/xui-cosmic" }

[build-dependencies]
xui-build = { version = "0.1.0", path = "../crates/xui-build" }
