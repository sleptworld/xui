[package]
name = "xui-vello"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
log = { workspace = true }
pollster = { workspace = true }
thiserror = "2.0.18"
vello = { version = "0.9.0", default-features = false, features = ["wgpu"] }
wgpu = { workspace = true }
# `wgpu` makes the canvas GPU-painter types (`CanvasGpuContext`) available, so
# the device this backend owns can be handed to the app, as `xui-skia` does.
xui-core = { path = "../xui-core", features = ["wgpu"] }
xui-interface = { path = "../xui-interface" }
xui-render-graph = { path = "../xui-render-graph" }
xui-shell = { path = "../xui-shell" }

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }
