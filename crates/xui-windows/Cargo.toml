[package]
name = "xui-windows"
version = "0.1.0"
edition = "2024"

[features]
default = ["skia"]
# A ready-made `runner` on the Skia backend with the `xui-f` text backend, the
# pairing the other hosts default to.
skia = ["dep:xui-skia", "dep:xui-f"]
# Skia on a wgpu-owned device, so a canvas GPU painter can composite its own
# shader output. Same meaning as `xui-winit`'s feature of that name.
skia-wgpu = ["skia", "xui-skia/wgpu", "xui-core/wgpu"]

[dependencies]
raw-window-handle = "0.6.2"
xui-core = { path = "../xui-core" }
xui-f = { path = "../xui-f", optional = true }
xui-interface = { path = "../xui-interface" }
xui-shell = { path = "../xui-shell" }
xui-skia = { path = "../xui-skia", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
