[package]
name = "xui-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cargo-xui"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
xui-pak = { path = "../xui-pak" }
xui-build = { path = "../xui-build" }

[dev-dependencies]
tempfile = "3"
